program: training/unet/sweep_unet.py
method: bayes
metric:
  name: val/dice
  goal: maximize
parameters:
  epochs:
    value: 50
  encoder:
    value: efficientnet-b0
  image_size:
    values: [384, 512, 640]
  batch_size:
    values: [2, 4, 6]
  lr:
    min: 0.00005
    max: 0.003
  weight_decay:
    min: 0.000001
    max: 0.001
  dice_weight:
    min: 0.2
    max: 0.8
  threshold:
    values: [0.4, 0.5, 0.6]
  seed:
    values: [42, 43, 44]
